<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Où est le Poulet? Balham</title>
<meta name="description" content="Dom's birthday pub crawl in Balham: check in, beat challenges, unlock clues and find the chicken.">
<meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Poulet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: app shell. Sticky glass top bar, content column (max 1080), bottom tab bar on phones / inline tabs on desktop.
   Views are persistent sections toggled by hash; the map section keeps its Leaflet instance alive. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#ECEEEA; --ink:#121614; --muted:#65706A; --line:#E0E4DE;
  --primary:#121614; --primary-ink:#FFFFFF; --yolk:#F5A524; --yolk-soft:#FFF1D6; --yolk-ink:#3A2500;
  --comb:#E5484D; --good:#1F9D55; --good-soft:#DDF3E5; --warn:#B26B00;
  --glass:rgba(244,245,242,.82); --shadow:0 1px 2px rgba(18,22,20,.06),0 8px 24px rgba(18,22,20,.06);
  --m-land:#F2F0EA; --m-minor:#FFFFFF; --m-mid:#FFFFFF; --m-major:#FFE2A8; --m-case:#D9D5CB; --m-green:#D3E7C6; --m-water:#BCDDF3; --m-rail:#9C9C98;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0E0D; --surface:#161917; --surface-2:#202421; --ink:#F1F3F0; --muted:#9AA49E; --line:#2A2F2C;
  --primary:#F1F3F0; --primary-ink:#0C0E0D; --yolk:#FBBF24; --yolk-soft:#3A2C0C; --yolk-ink:#FFF4DA;
  --comb:#FF6B6F; --good:#4ADE80; --good-soft:#123222; --warn:#F5B547;
  --glass:rgba(12,14,13,.8); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --m-land:#191C1A; --m-minor:#2B302D; --m-mid:#353B37; --m-major:#4D4330; --m-case:#111312; --m-green:#1E3124; --m-water:#18293A; --m-rail:#6E716F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C0E0D; --surface:#161917; --surface-2:#202421; --ink:#F1F3F0; --muted:#9AA49E; --line:#2A2F2C;
  --primary:#F1F3F0; --primary-ink:#0C0E0D; --yolk:#FBBF24; --yolk-soft:#3A2C0C; --yolk-ink:#FFF4DA;
  --comb:#FF6B6F; --good:#4ADE80; --good-soft:#123222; --warn:#F5B547;
  --glass:rgba(12,14,13,.8); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --m-land:#191C1A; --m-minor:#2B302D; --m-mid:#353B37; --m-major:#4D4330; --m-case:#111312; --m-green:#1E3124; --m-water:#18293A; --m-rail:#6E716F;
  color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1080px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar .col{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.logo .mark{width:34px;height:34px;border-radius:11px;background:var(--yolk);display:grid;place-items:center;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toptabs{display:flex;gap:2px;margin-left:auto;background:var(--surface-2);padding:4px;border-radius:12px}
.toptabs a{position:relative;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 14px;border-radius:9px}
.toptabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.teampill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px 6px 8px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.teampill .sw{width:18px;height:18px;border-radius:50%}
.sync{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.live{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--comb);color:#fff;font-size:11px;font-weight:700;margin-left:4px;vertical-align:1px}

/* bottom nav (phones) */
.bottomnav{display:none}
@media (max-width:760px){
  .toptabs{display:none}
  .teampill{margin-left:auto}
  .logo small{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;border-radius:12px;position:relative}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a[aria-current="page"]{color:var(--ink)}
  .bottomnav a[aria-current="page"] svg{color:var(--yolk)}
  .bottomnav .cnt{position:absolute;top:2px;left:calc(50% + 6px)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}

main{padding-block:20px 48px}
section.view{display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;line-height:1.05}
h2{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.15}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}

/* buttons + inputs */
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:transform .08s, background .15s, border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.yolk{background:var(--yolk);color:#1D1300;border-color:var(--yolk)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.danger{color:var(--comb)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
input[type=text],input[type=search],input[type=time],input[type=number],textarea,select{font:inherit;font-size:16px;width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.yolk{background:var(--yolk-soft);color:var(--yolk-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--comb) 14%,transparent);color:var(--comb)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* play */
.hero{border-radius:24px;padding:22px;color:#fff;display:grid;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{color:#fff}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.hero .stat{background:rgba(0,0,0,.18);border-radius:14px;padding:10px 12px}
.hero .stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.hero .stat span{font-size:12px;opacity:.9;font-weight:600}
.hero .who{font-size:13px;opacity:.9;font-weight:500;position:relative;z-index:1}
.progress{display:flex;gap:6px;align-items:center}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.progress i.on{background:var(--yolk)}
.chal{border:2px solid var(--yolk);background:var(--yolk-soft)}
.chal .t{font-family:var(--display);font-weight:800;font-size:20px}
.clue{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:var(--surface-2)}
.clue .n{width:44px;height:44px;border-radius:14px;background:var(--yolk);color:#1D1300;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.clue.locked{opacity:.6}
.clue.locked .n{background:var(--line);color:var(--muted)}
.clue p{font-size:16px;font-weight:500}
.timeline{display:grid}
.tl{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2)}
.tl .k.c{background:var(--yolk);color:#1D1300}
.empty{text-align:center;padding:26px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.teampick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.teampick button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:16px;cursor:pointer;display:grid;gap:8px}
.teampick button:hover{border-color:var(--ink)}
.teampick .sw{width:28px;height:28px;border-radius:9px}
.media-prev{display:flex;gap:8px;flex-wrap:wrap}
.media-prev img,.media-prev video{width:120px;height:120px;object-fit:cover;border-radius:12px;background:var(--surface-2);max-width:100%}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;display:grid;gap:6px;justify-items:center;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--muted)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.mapbox{isolation:isolate;z-index:0;position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);height:clamp(380px,calc(100dvh - 190px),760px);background:var(--m-land)}
#leaflet{position:absolute;inset:0;background:var(--m-land)}
.maptools{position:absolute;z-index:500;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.maptools > *{pointer-events:auto}
.chipbtn{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.publist{display:grid;gap:10px;max-height:clamp(380px,calc(100dvh - 190px),760px);overflow:auto;padding-right:2px}
.publist .items{display:grid;gap:6px}
.pubrow{font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;width:100%}
.pubrow:hover,.pubrow.sel{border-color:var(--ink)}
.pubrow .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-size:12px;font-weight:700}
.pubrow .ic.start{background:var(--yolk);color:#1D1300}
.pubrow .ic.done{background:var(--good);color:#fff}
.pubrow b{display:block;font-weight:600;line-height:1.25}
.pubrow small{color:var(--muted);font-size:12px}
@media (max-width:900px){ .mapwrap{grid-template-columns:1fr} .mapbox{height:62vh} .publist{max-height:none} }
.leaflet-container{font-family:var(--body);background:var(--m-land)}
.dark-tiles .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.osm-tiles{filter:saturate(.75)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:14px 16px;min-width:200px}
.leaflet-popup-content .pp{display:grid;gap:8px}
.leaflet-popup-content b{font-size:15px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink)!important}
.leaflet-bar a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.pin-start{background:var(--yolk);color:#1D1300;font-weight:800;font-size:11px;border-radius:999px;padding:4px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;border:2px solid #fff;transform:translate(-50%,-50%);position:absolute;left:0;top:0}
.pin-stn{width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid #121614;box-shadow:0 1px 4px rgba(0,0,0,.3);position:absolute;left:-11px;top:-11px}
.pin-team{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);position:absolute;left:-13px;top:-13px}
.rdlabel{font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;text-shadow:0 0 3px var(--m-land),0 0 3px var(--m-land),0 0 3px var(--m-land);transform:translate(-50%,-50%);position:absolute;pointer-events:none;letter-spacing:.02em}

.leaflet-tooltip.pubtip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;width:270px;white-space:normal}
.leaflet-tooltip.pubtip::before{border-top-color:var(--surface)}
.pcard{display:grid;gap:10px}
.pc-h{display:grid;gap:1px}
.pc-h b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc-grid > div{background:var(--surface-2);border-radius:10px;padding:7px 8px;display:grid;gap:1px;min-width:0}
.pc-grid .lbl{font-size:10px}
.pc-grid b{font-size:16px;line-height:1.2}
.pc-grid b.ok{color:var(--good)} .pc-grid b.no{color:var(--comb)}
.pc-grid .sm{font-size:11px;line-height:1.25}
.pcard details summary{cursor:pointer;color:var(--muted);font-weight:600}
table.hrs{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
table.hrs td{padding:3px 0;border-top:1px solid var(--line)} table.hrs td:last-child{text-align:right}
table.hrs tr.today td{font-weight:700}
.pinfo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
@media (max-width:520px){ .pinfo{grid-template-columns:1fr} }
.switch{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;cursor:pointer;padding:6px 0}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s;flex:none;margin-top:2px}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .track{background:var(--good)}
.switch input:checked + .track .knob{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:3px solid var(--yolk);outline-offset:2px}
.statebar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){ .statebar{grid-template-columns:1fr} }
.statebtn{font:inherit;text-align:left;display:grid;gap:4px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.statebtn .sm{color:var(--muted)}
.statebtn.on{border-color:var(--ink);background:var(--surface-2)}
.statebtn.on b::before{content:"● ";color:var(--good)}
.media-ph{width:120px;height:120px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:12px}
/* teams */
.teamcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.teamcard .top{padding:16px 18px;display:flex;gap:12px;align-items:center}
.teamcard .sw{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:18px;flex:none}
.teamcard .body{padding:0 18px 16px;display:grid;gap:12px}
.members{display:flex;flex-wrap:wrap;gap:6px}
.members span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.kpis b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.kpis span{font-size:12px;color:var(--muted);font-weight:600}

/* rules */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.fact b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.fact.yolk{background:var(--yolk);border-color:var(--yolk);color:#1D1300}
.fact.yolk .lbl{color:#5A3D00}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
ol.steps li::before{content:counter(s);width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
ol.steps li p{color:var(--muted);margin-top:3px;max-width:64ch}
ul.plain{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.plain li{display:grid;grid-template-columns:20px 1fr;gap:8px}
ul.plain li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yolk);margin-top:8px}

/* admin */
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.segs::-webkit-scrollbar{display:none}
.segs button{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.segs button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.sub{display:grid;gap:10px}
.sub .media-prev img,.sub .media-prev video{width:min(100%,260px);height:auto;max-height:320px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.clueedit{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start}
.clueedit .n{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-weight:800}
.chalrow{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.chalrow:first-child{border-top:0}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
@media (min-width:761px){ .scrim{align-items:center} .sheet{border-radius:24px;padding-bottom:20px} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:1100;background:var(--primary);color:var(--primary-ink);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:761px){ .toast{bottom:24px} }
.banner{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--surface-2)}
.banner.yolk{background:var(--yolk-soft);color:var(--yolk-ink)}
</style>
</head>
