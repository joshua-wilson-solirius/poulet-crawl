<title>Où est le Poulet? Balham</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>/*LEAFLETCSS*/</style>
<style>
/* Layout: app shell. Sticky glass top bar, content column (max 1080), bottom tab bar on phones / inline tabs on desktop.
   Views are persistent sections toggled by hash; the map section keeps its Leaflet instance alive. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#ECEEEA; --ink:#121614; --muted:#65706A; --line:#E0E4DE;
  --primary:#121614; --primary-ink:#FFFFFF; --yolk:#F5A524; --yolk-soft:#FFF1D6; --yolk-ink:#3A2500;
  --comb:#E5484D; --good:#1F9D55; --good-soft:#DDF3E5; --warn:#B26B00;
  --glass:rgba(244,245,242,.82); --shadow:0 1px 2px rgba(18,22,20,.06),0 8px 24px rgba(18,22,20,.06);
  --m-land:#F2F0EA; --m-minor:#FFFFFF; --m-mid:#FFFFFF; --m-major:#FFE2A8; --m-case:#D9D5CB; --m-green:#D3E7C6; --m-water:#BCDDF3; --m-rail:#9C9C98;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0E0D; --surface:#161917; --surface-2:#202421; --ink:#F1F3F0; --muted:#9AA49E; --line:#2A2F2C;
  --primary:#F1F3F0; --primary-ink:#0C0E0D; --yolk:#FBBF24; --yolk-soft:#3A2C0C; --yolk-ink:#FFF4DA;
  --comb:#FF6B6F; --good:#4ADE80; --good-soft:#123222; --warn:#F5B547;
  --glass:rgba(12,14,13,.8); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --m-land:#191C1A; --m-minor:#2B302D; --m-mid:#353B37; --m-major:#4D4330; --m-case:#111312; --m-green:#1E3124; --m-water:#18293A; --m-rail:#6E716F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C0E0D; --surface:#161917; --surface-2:#202421; --ink:#F1F3F0; --muted:#9AA49E; --line:#2A2F2C;
  --primary:#F1F3F0; --primary-ink:#0C0E0D; --yolk:#FBBF24; --yolk-soft:#3A2C0C; --yolk-ink:#FFF4DA;
  --comb:#FF6B6F; --good:#4ADE80; --good-soft:#123222; --warn:#F5B547;
  --glass:rgba(12,14,13,.8); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --m-land:#191C1A; --m-minor:#2B302D; --m-mid:#353B37; --m-major:#4D4330; --m-case:#111312; --m-green:#1E3124; --m-water:#18293A; --m-rail:#6E716F;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1080px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar .col{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.logo .mark{width:34px;height:34px;border-radius:11px;background:var(--yolk);display:grid;place-items:center;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toptabs{display:flex;gap:2px;margin-left:auto;background:var(--surface-2);padding:4px;border-radius:12px}
.toptabs a{position:relative;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 14px;border-radius:9px}
.toptabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.teampill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px 6px 8px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.teampill .sw{width:18px;height:18px;border-radius:50%}
.sync{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.live{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--comb);color:#fff;font-size:11px;font-weight:700;margin-left:4px;vertical-align:1px}

/* bottom nav (phones) */
.bottomnav{display:none}
@media (max-width:760px){
  .toptabs{display:none}
  .teampill{margin-left:auto}
  .logo small{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;border-radius:12px;position:relative}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a[aria-current="page"]{color:var(--ink)}
  .bottomnav a[aria-current="page"] svg{color:var(--yolk)}
  .bottomnav .cnt{position:absolute;top:2px;left:calc(50% + 6px)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}

main{padding-block:20px 48px}
section.view{display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;line-height:1.05}
h2{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.15}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}

/* buttons + inputs */
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:transform .08s, background .15s, border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.yolk{background:var(--yolk);color:#1D1300;border-color:var(--yolk)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.danger{color:var(--comb)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
input[type=text],input[type=search],input[type=time],input[type=number],textarea,select{font:inherit;font-size:16px;width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.yolk{background:var(--yolk-soft);color:var(--yolk-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--comb) 14%,transparent);color:var(--comb)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* play */
.hero{border-radius:24px;padding:22px;color:#fff;display:grid;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{color:#fff}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.hero .stat{background:rgba(0,0,0,.18);border-radius:14px;padding:10px 12px}
.hero .stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.hero .stat span{font-size:12px;opacity:.9;font-weight:600}
.hero .who{font-size:13px;opacity:.9;font-weight:500;position:relative;z-index:1}
.progress{display:flex;gap:6px;align-items:center}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.progress i.on{background:var(--yolk)}
.chal{border:2px solid var(--yolk);background:var(--yolk-soft)}
.chal .t{font-family:var(--display);font-weight:800;font-size:20px}
.clue{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:var(--surface-2)}
.clue .n{width:44px;height:44px;border-radius:14px;background:var(--yolk);color:#1D1300;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.clue.locked{opacity:.6}
.clue.locked .n{background:var(--line);color:var(--muted)}
.clue p{font-size:16px;font-weight:500}
.timeline{display:grid}
.tl{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2)}
.tl .k.c{background:var(--yolk);color:#1D1300}
.empty{text-align:center;padding:26px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.teampick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.teampick button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:16px;cursor:pointer;display:grid;gap:8px}
.teampick button:hover{border-color:var(--ink)}
.teampick .sw{width:28px;height:28px;border-radius:9px}
.media-prev{display:flex;gap:8px;flex-wrap:wrap}
.media-prev img,.media-prev video{width:120px;height:120px;object-fit:cover;border-radius:12px;background:var(--surface-2);max-width:100%}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;display:grid;gap:6px;justify-items:center;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--muted)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.mapbox{isolation:isolate;z-index:0;position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);height:clamp(380px,calc(100dvh - 190px),760px);background:var(--m-land)}
#leaflet{position:absolute;inset:0;background:var(--m-land)}
.maptools{position:absolute;z-index:500;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.maptools > *{pointer-events:auto}
.chipbtn{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.publist{display:grid;gap:10px;max-height:clamp(380px,calc(100dvh - 190px),760px);overflow:auto;padding-right:2px}
.publist .items{display:grid;gap:6px}
.pubrow{font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;width:100%}
.pubrow:hover,.pubrow.sel{border-color:var(--ink)}
.pubrow .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-size:12px;font-weight:700}
.pubrow .ic.start{background:var(--yolk);color:#1D1300}
.pubrow .ic.done{background:var(--good);color:#fff}
.pubrow b{display:block;font-weight:600;line-height:1.25}
.pubrow small{color:var(--muted);font-size:12px}
@media (max-width:900px){ .mapwrap{grid-template-columns:1fr} .mapbox{height:62vh} .publist{max-height:none} }
.leaflet-container{font-family:var(--body);background:var(--m-land)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:14px 16px;min-width:200px}
.leaflet-popup-content .pp{display:grid;gap:8px}
.leaflet-popup-content b{font-size:15px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink)!important}
.leaflet-bar a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.pin-start{background:var(--yolk);color:#1D1300;font-weight:800;font-size:11px;border-radius:999px;padding:4px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;border:2px solid #fff;transform:translate(-50%,-50%);position:absolute;left:0;top:0}
.pin-stn{width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid #121614;box-shadow:0 1px 4px rgba(0,0,0,.3);position:absolute;left:-11px;top:-11px}
.pin-team{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);position:absolute;left:-13px;top:-13px}
.rdlabel{font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;text-shadow:0 0 3px var(--m-land),0 0 3px var(--m-land),0 0 3px var(--m-land);transform:translate(-50%,-50%);position:absolute;pointer-events:none;letter-spacing:.02em}

.leaflet-tooltip.pubtip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;width:270px;white-space:normal}
.leaflet-tooltip.pubtip::before{border-top-color:var(--surface)}
.pcard{display:grid;gap:10px}
.pc-h{display:grid;gap:1px}
.pc-h b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc-grid > div{background:var(--surface-2);border-radius:10px;padding:7px 8px;display:grid;gap:1px;min-width:0}
.pc-grid .lbl{font-size:10px}
.pc-grid b{font-size:16px;line-height:1.2}
.pc-grid b.ok{color:var(--good)} .pc-grid b.no{color:var(--comb)}
.pc-grid .sm{font-size:11px;line-height:1.25}
.pcard details summary{cursor:pointer;color:var(--muted);font-weight:600}
table.hrs{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
table.hrs td{padding:3px 0;border-top:1px solid var(--line)} table.hrs td:last-child{text-align:right}
table.hrs tr.today td{font-weight:700}
.pinfo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
@media (max-width:520px){ .pinfo{grid-template-columns:1fr} }
/* teams */
.teamcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.teamcard .top{padding:16px 18px;display:flex;gap:12px;align-items:center}
.teamcard .sw{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:18px;flex:none}
.teamcard .body{padding:0 18px 16px;display:grid;gap:12px}
.members{display:flex;flex-wrap:wrap;gap:6px}
.members span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.kpis b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.kpis span{font-size:12px;color:var(--muted);font-weight:600}

/* rules */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.fact b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.fact.yolk{background:var(--yolk);border-color:var(--yolk);color:#1D1300}
.fact.yolk .lbl{color:#5A3D00}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
ol.steps li::before{content:counter(s);width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
ol.steps li p{color:var(--muted);margin-top:3px;max-width:64ch}
ul.plain{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.plain li{display:grid;grid-template-columns:20px 1fr;gap:8px}
ul.plain li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yolk);margin-top:8px}

/* admin */
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.segs::-webkit-scrollbar{display:none}
.segs button{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.segs button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.sub{display:grid;gap:10px}
.sub .media-prev img,.sub .media-prev video{width:min(100%,260px);height:auto;max-height:320px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.clueedit{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start}
.clueedit .n{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-weight:800}
.chalrow{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.chalrow:first-child{border-top:0}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
@media (min-width:761px){ .scrim{align-items:center} .sheet{border-radius:24px;padding-bottom:20px} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }

</style>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* =================== settings you can change =================== */
const CONFIG = {
  hosts: "Dom & Josh",
  buyIn: "£15",
  meetPub: "The Bedford",
  meetAddr: "77 Bedford Hill, SW12 9HD",
  radiusMiles: 1,
  defaultInterval: 2,
};
const DEFAULT_TEAMS = [
  {id:"poulet",  name:"Le Poulet",    color:"#E0A100", chicken:true, members:["Dom","Josh"]},
  {id:"coqs",    name:"Les Coqs",     color:"#E5484D", members:["Sam","Jordan","Chloe"]},
  {id:"nuggets", name:"The Nuggets",  color:"#3E63DD", members:["Marcus","Ellie","Tom"]},
  {id:"rangers", name:"Free Rangers", color:"#12A594", members:["Hana","Ben","Zara"]},
  {id:"hens",    name:"Hen Party",    color:"#8E4EC6", members:["Rosie","Kwame","Lily"]},
];
const PALETTE = ["#E5484D","#3E63DD","#12A594","#8E4EC6","#F76B15","#D6409F","#0090FF","#46A758","#E0A100","#6E56CF"];

/* =================== map data (OpenStreetMap, ODbL) =================== */
const MAP = __MAPDATA__;
const dec = a=>{const o=[];let la=0,ln=0;for(let i=0;i<a.length;i+=2){la+=a[i];ln+=a[i+1];o.push([la/1e5,ln/1e5]);}return o;};
const STN = MAP.station;
const KX = Math.cos(STN.lat*Math.PI/180)*111320, KY=110540;
const metres = (a,b)=>Math.hypot((b.lng-a.lng)*KX,(b.lat-a.lat)*KY);
const PUBS = MAP.pubs.map(p=>({id:"p"+p.osm, name:p.name, lat:p.lat, lng:p.lng, d:p.d, addr:p.addr, hours:p.hours, web:p.web, garden:p.garden, food:p.food, brand:p.brand}));
/* opening hours: understands the common OpenStreetMap forms, e.g. "Mo-Th 12:00-23:00; Fr,Sa 12:00-01:00; Su off" */
const DAYS=["Mo","Tu","We","Th","Fr","Sa","Su"], DAYNAME={Mo:"Mon",Tu:"Tue",We:"Wed",Th:"Thu",Fr:"Fri",Sa:"Sat",Su:"Sun"};
function parseHours(str){
  if(!str) return null; const out={}; let ok=false;
  for(const rule of str.split(";").map(x=>x.trim()).filter(Boolean)){
    const m=rule.match(/^((?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*[-,]\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))*)\s+(.+)$/); if(!m) continue;
    const days=new Set();
    m[1].split(",").forEach(part=>{const [a,b]=part.split("-").map(x=>x.trim()); const i=DAYS.indexOf(a), j=b?DAYS.indexOf(b):i;
      for(let k=i;;k=(k+1)%7){days.add(DAYS[k]); if(k===j) break;}});
    const spans=/off|closed/i.test(m[2])?[]:m[2].split(",").map(r=>r.trim().match(/^(\d\d):(\d\d)\s*-\s*(\d\d):(\d\d)$/)).filter(Boolean)
      .map(t=>{const o=+t[1]*60+ +t[2]; let c=+t[3]*60+ +t[4]; if(c<=o) c+=1440; return [o,c];});
    days.forEach(d=>{out[d]=spans;}); ok=true;
  }
  return ok?out:null;
}
const hm=m=>{m%=1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
function hoursNow(str, when){
  const H=parseHours(str); if(!H) return null;
  const d=when||new Date(), di=(d.getDay()+6)%7, mins=d.getHours()*60+d.getMinutes();
  const today=H[DAYS[di]], yest=H[DAYS[(di+6)%7]];
  if(yest) for(const [o,c] of yest) if(c>1440&&mins<c-1440) return {open:true,txt:`Open until ${hm(c)}`};
  if(today===undefined) return {open:null,txt:"Today's hours not listed"};
  for(const [o,c] of today){ if(mins>=o&&mins<c) return {open:true,txt:`Open until ${hm(c)}`}; if(mins<o) return {open:false,txt:`Opens at ${hm(o)}`}; }
  return {open:false,txt:today.length?"Closed for the day":"Closed today"};
}
function weekRows(str){const H=parseHours(str); if(!H) return ""; const di=(new Date().getDay()+6)%7;
  return `<table class="hrs">${DAYS.map((d,i)=>`<tr class="${i===di?"today":""}"><td>${DAYNAME[d]}</td><td>${H[d]===undefined?"–":H[d].length?H[d].map(([o,c])=>hm(o)+"–"+hm(c)).join(", "):"Closed"}</td></tr>`).join("")}</table>`;}
const pubById = id=>PUBS.find(p=>p.id===id);
const START = PUBS.find(p=>/^the bedford$/i.test(p.name)) || PUBS[0];
const fmtMi = m=>(m/1609.344).toFixed(m<1609?2:1)+" mi";
const walkMin = m=>Math.max(1,Math.round(m*1.3/80));
const compass = (a,b)=>{const ang=(Math.atan2((b.lng-a.lng)*KX,(b.lat-a.lat)*KY)*180/Math.PI+360)%360;return ["north","north-east","east","south-east","south","south-west","west","north-west"][Math.round(ang/45)%8];};

/* =================== store (claude.ai db, or this device as a fallback) =================== */
let db=null, assets=null, userApi=null;
const docs = {};        // path -> body
const LS="poulet-v2";
const ls = {get(k){try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}};
const S = {mode:"connecting", loaded:false, canWrite:true, me:{id:null,isOwner:false}, adminTab:"review", q:"", selPub:null, draft:{}};
const queues={};
const enqueue=(k,fn)=>{queues[k]=(queues[k]||Promise.resolve()).then(fn,fn);return queues[k];};
function onWriteError(e){
  if(e&&e.code==="invalid_argument"){S.canWrite=false;toast("You can look but not change things. Ask the organisers for access.");}
  else if(e&&e.code==="quota_exceeded") toast("Storage is full. Ask an organiser to clear old evidence.");
  else toast("That didn't save. Check your signal and try again.");
  renderAll();
}
function put(path, body){
  docs[path]=body; derive(); renderAll();
  if(db) enqueue(path,()=>db.doc(path).set(body).catch(onWriteError)); else ls.set("docs",docs);
}
function drop(path){
  delete docs[path]; derive(); renderAll();
  if(db) enqueue(path,()=>db.doc(path).delete().catch(onWriteError)); else ls.set("docs",docs);
}

/* =================== derived state =================== */
let D = {};
function derive(){
  const g=p=>docs[p];
  const teams=(g("content/teams")&&g("content/teams").list)||DEFAULT_TEAMS;
  const settings=Object.assign({interval:CONFIG.defaultInterval,start:"",kitty:""}, g("content/settings")||{});
  const visits={}, subs=[], unlocked={}, found={};
  for(const [p,b] of Object.entries(docs)){
    if(p.startsWith("visits/")) (visits[b.team]=visits[b.team]||[]).push(b);
    else if(p.startsWith("subs/")) subs.push(Object.assign({_id:p.slice(5)},b));
    else if(p.startsWith("unlocked/")) unlocked[p.slice(9)]=b.clues||[];
    else if(p.startsWith("found/")&&b.found) found[p.slice(6)]=b;
  }
  Object.values(visits).forEach(v=>v.sort((a,b)=>a.at-b.at));
  subs.sort((a,b)=>b.at-a.at);
  D = {teams, settings, visits, subs, unlocked, found,
       challenges:(g("content/challenges")&&g("content/challenges").byPub)||{},
       admins:(g("content/admins")&&g("content/admins").ids)||[],
       pubinfo:(g("content/pubinfo")&&g("content/pubinfo").byPub)||{},
       secret:Object.assign({hideout:null,clues:[]}, g("secret/game")||{})};
  D.interval=Math.max(1,parseInt(D.settings.interval)||2);
}
const hunters=()=>D.teams.filter(t=>!t.chicken);
const chicken=()=>D.teams.find(t=>t.chicken)||D.teams[0];
const teamById=id=>D.teams.find(t=>t.id===id);
const isAdmin=()=>S.mode==="local"||S.me.isOwner||(S.me.id&&D.admins.includes(S.me.id));
const myTeamId=()=>{const v=ls.get("team");return hunters().some(t=>t.id===v)?v:null;};
const visitsOf=t=>D.visits[t]||[];
const lastPubOf=t=>{const v=visitsOf(t);return v.length?pubById(v[v.length-1].pub):null;};
const isStop=i=>(i+1)%D.interval===0;               // i = 0-based visit index
const subFor=(t,pub)=>D.subs.find(s=>s.team===t&&s.pub===pub);
const foundOrder=()=>hunters().filter(t=>D.found[t.id]).sort((a,b)=>D.found[a.id].at-D.found[b.id].at).map(t=>t.id);
const pending=()=>D.subs.filter(s=>s.status==="pending");
const challengeFor=pubId=>{const c=D.challenges[pubId];return c&&(c.title||c.text)?c:(D.challenges._all&&(D.challenges._all.title||D.challenges._all.text)?D.challenges._all:null);};

function autoClue(n, fromPub){
  const H=pubById(D.secret.hideout); if(!H) return "The chicken hasn't picked a hideout yet. Ask them for a hint in person.";
  const P=fromPub||START, d=metres(P,H);
  if(P.id===H.id) return "Look around you. The chicken is in this very pub.";
  switch(n){
    case 0: return `From ${P.name}, head roughly ${compass(P,H)}.`;
    case 1: return `The chicken is about ${fmtMi(d)} from ${P.name}, roughly a ${walkMin(d)}-minute walk.`;
    case 2: return `The chicken's pub is ${fmtMi(H.d)} from Balham station, to the ${compass(STN,H)}.`;
    case 3: return `Ignore "The": the pub's name starts with ${H.name.replace(/^The\s+/i,"")[0].toUpperCase()}.`;
    case 4: return `The pub's name has ${H.name.replace(/^The\s+/i,"").split(/\s+/).length} word(s) once you drop "The".`;
    default: return `You're ${Math.round(d/25)*25} m from the chicken. Very warm.`;
  }
}

/* =================== helpers =================== */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago";};
const hhmm=t=>new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
const gmaps=p=>"https://www.google.com/maps/dir/?api=1&travelmode=walking&destination="+p.lat+","+p.lng;
const ICON={
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4"/><path d="M4 4h12l-2 4 2 4H4"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>',
  teams:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>',
  rules:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M9 9h6M9 13h6"/></svg>',
  admin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  walk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="m9 21 2-6 3 3v3M7 12l3-4 4 1 3 3M11 15l-1-4"/></svg>',
};
let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}
function openSheet(html){document.getElementById("sheetroot").innerHTML=`<div class="scrim" data-action="closesheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const f=document.querySelector(".sheet input[type=search],.sheet [autofocus]"); if(f&&matchMedia("(min-width:761px)").matches) f.focus();}
function closeSheet(){document.getElementById("sheetroot").innerHTML="";}

/* =================== navigation =================== */
const NAV=[["play","Play"],["map","Map"],["teams","Teams"],["rules","Rules"],["admin","Chicken HQ"]];
const route=()=>{const h=location.hash.slice(1);if(h==="admin"&&!isAdmin())return "play";return NAV.some(n=>n[0]===h)?h:"play";};
function renderChrome(){
  const r=route(), items=NAV.filter(n=>n[0]!=="admin"||isAdmin()), pc=pending().length;
  const badge=k=>k==="admin"&&pc?`<span class="cnt">${pc}</span>`:"";
  document.getElementById("toptabs").innerHTML=items.map(([k,l])=>`<a href="#${k}" ${r===k?'aria-current="page"':""}>${l}${badge(k)}</a>`).join("");
  document.getElementById("bottomnav").innerHTML=items.map(([k,l])=>`<a href="#${k}" ${r===k?'aria-current="page"':""}>${ICON[k]}<span>${k==="admin"?"HQ":l}</span>${badge(k)}</a>`).join("");
  const t=teamById(myTeamId());
  document.getElementById("teampill").innerHTML=t?`<span class="sw" style="background:${t.color}"></span>${esc(t.name)}`:`Pick your team`;
  const s=document.getElementById("sync"); s.className="sync"+(S.mode==="db"&&S.loaded?" live":"");
  s.title=S.mode==="db"?(S.loaded?"Live: everyone sees the same game":"Connecting…"):"Saved on this device only";
  NAV.forEach(([k])=>{document.getElementById("v-"+k).hidden=(k!==r);});
}

/* =================== PLAY =================== */
function teamPicker(){
  return `<div class="teampick">${hunters().map(t=>`<button type="button" data-action="setteam" data-id="${t.id}"><span class="sw" style="background:${t.color}"></span><b>${esc(t.name)}</b><span class="sm muted">${t.members.map(esc).join(", ")}</span></button>`).join("")}</div>`;
}
function viewPlay(){
  const tid=myTeamId();
  if(!tid) return `<div><h1>Bonsoir! Which team are you on?</h1><p class="muted" style="margin-top:6px">Pick once and this phone remembers. You can switch any time from the top bar.</p></div>${teamPicker()}
    <div class="banner yolk">Meet at <b>${esc(CONFIG.meetPub)}</b>, ${esc(CONFIG.meetAddr)}${D.settings.start?` at <b>${esc(D.settings.start)}</b>`:""}. ${esc(CONFIG.hosts)} are buying the first round.</div>`;
  const t=teamById(tid), v=visitsOf(tid), clues=D.unlocked[tid]||[], n=v.length, k=D.interval;
  const toNext=k-(n%k), found=D.found[tid];
  const last=v.length?v[v.length-1]:null, lastIdx=n-1;
  const lastSub=last?subFor(tid,last.pub):null;
  const showChal=last&&isStop(lastIdx)&&!(lastSub&&lastSub.status==="approved");
  let h=`<div class="hero" style="background:linear-gradient(135deg, ${t.color}, color-mix(in srgb, ${t.color} 62%, #000))">
    <div class="row" style="position:relative;z-index:1"><span class="lbl" style="color:rgba(255,255,255,.85)">Your team</span><span class="spacer"></span>${found?'<span class="pill" style="background:#fff;color:#121614">Found the chicken</span>':""}</div>
    <h1 style="position:relative;z-index:1">${esc(t.name)}</h1>
    <div class="who">${t.members.map(esc).join(" · ")}</div>
    <div class="stats"><div class="stat"><b class="num">${n}</b><span>Pubs</span></div><div class="stat"><b class="num">${clues.length}</b><span>Clues</span></div><div class="stat"><b class="num">${found?"—":toNext}</b><span>${found?"Hiding now":"To next challenge"}</span></div></div>
  </div>`;
  if(found){
    h+=`<div class="card"><h2>You found them. Now you're the chicken too.</h2><p class="muted">Stay put, keep it quiet, and enjoy watching the others search.</p></div>`;
  } else {
    h+=`<div class="card"><div class="row"><div style="min-width:0"><h2>${last?`At ${esc(pubById(last.pub).name)}?`:"Ready when you are"}</h2><p class="muted sm">${last?`Checked in ${ago(last.at)}. Moving on? Check in at the next pub.`:`Everyone starts at ${esc(CONFIG.meetPub)}. Check in when you walk into each pub.`}</p></div></div>
      <div class="progress" aria-label="Progress to next challenge">${Array.from({length:k},(_,i)=>`<i class="${i<(n%k||(n&&showChal?k:0))?"on":""}"></i>`).join("")}</div>
      <button class="btn primary block" data-action="checkin" ${S.canWrite?"":"disabled"}>${ICON.pin} Check in to a pub</button></div>`;
    if(showChal) h+=challengeCard(tid,last.pub,lastIdx);
  }
  h+=`<div class="card"><div class="row"><h2>Clues</h2><span class="spacer"></span><span class="pill yolk">${clues.length} unlocked</span></div>
    ${clues.length?clues.slice().reverse().map((c,i)=>`<div class="clue"><div class="n">${clues.length-i}</div><div><p>${esc(c.text)}</p><span class="sm muted">Unlocked ${hhmm(c.at)}${c.pub&&pubById(c.pub)?` · from ${esc(pubById(c.pub).name)}`:""}</span></div></div>`).join(""):""}
    <div class="clue locked"><div class="n">${clues.length+1}</div><div><p>Locked</p><span class="sm muted">Finish the challenge at your next challenge pub and send evidence. The chicken unlocks it.</span></div></div>
  </div>`;
  h+=`<div class="card"><h2>Your crawl</h2>${v.length?`<div class="timeline">${v.slice().reverse().map((x,ri)=>{const i=v.length-1-ri,p=pubById(x.pub),st=isStop(i),s=st?subFor(tid,x.pub):null;
      return `<div class="tl"><span class="k ${st?"c":""}">${i+1}</span><div style="min-width:0"><b>${esc(p?p.name:"Unknown pub")}</b><div class="sm muted">${hhmm(x.at)}${st?" · challenge pub":""}</div></div>
      <div class="row" style="gap:6px">${st?statusPill(s):""}${st&&!(s&&s.status==="approved")?`<button class="btn sm" data-action="openchal" data-pub="${x.pub}" data-i="${i}">Challenge</button>`:""}${ri===0&&!(s&&s.status==="approved")?`<button class="btn sm ghost" data-action="undovisit" data-pub="${x.pub}" aria-label="Undo check-in">Undo</button>`:""}</div></div>`;}).join("")}</div>`
    :`<div class="empty">${ICON.walk.replace("<svg",'<svg width="28" height="28"')}<span>No pubs yet. Your first check-in starts the clock.</span></div>`}</div>`;
  return h;
}
function statusPill(s){if(!s)return `<span class="pill">To do</span>`;return s.status==="approved"?`<span class="pill good">Clue ${s.clue||""} unlocked</span>`:s.status==="rejected"?`<span class="pill bad">Try again</span>`:`<span class="pill yolk">With the chicken</span>`;}
function challengeCard(tid,pubId,i){

/* =================== MAP =================== */
let LM=null, layers={}, pubMarkers={};
const HOVER=matchMedia("(hover:hover) and (pointer:fine)").matches;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function initMap(){
  if(LM||typeof L==="undefined") return;
  const canvas=L.canvas({padding:.5});
  LM=L.map("leaflet",{preferCanvas:true,renderer:canvas,zoomSnap:.5,minZoom:13,maxZoom:18,attributionControl:true,zoomControl:false});
  LM.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  LM.attributionControl.addAttribution('Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>');
  LM.setView([STN.lat,STN.lng],14); L.control.zoom({position:"bottomright"}).addTo(LM);
  const pad=0.022; LM.setMaxBounds([[STN.lat-pad,STN.lng-pad*1.6],[STN.lat+pad,STN.lng+pad*1.6]]);
  layers.green=L.layerGroup(MAP.green.map(a=>L.polygon(dec(a),{renderer:canvas,stroke:false,fillOpacity:1,interactive:false}))).addTo(LM);
  layers.water=L.layerGroup(MAP.water.map(a=>L.polygon(dec(a),{renderer:canvas,stroke:false,fillOpacity:1,interactive:false}))).addTo(LM);
  const lines=(arr)=>arr.map(a=>dec(a));
  const minor=lines(MAP.roads.minor), mid=lines(MAP.roads.mid), major=lines(MAP.roads.major), rail=lines(MAP.rail);
  const pl=(ll,o)=>L.polyline(ll,Object.assign({renderer:canvas,interactive:false,lineCap:"round",lineJoin:"round"},o));
  layers.case=L.layerGroup([pl(minor,{weight:5}),pl(mid,{weight:8}),pl(major,{weight:10})]).addTo(LM);
  layers.minor=pl(minor,{weight:3}).addTo(LM); layers.mid=pl(mid,{weight:5.5}).addTo(LM); layers.major=pl(major,{weight:7}).addTo(LM);
  layers.rail=L.layerGroup([pl(rail,{weight:3.5}),pl(rail,{weight:1.6,dashArray:"6 8"})]).addTo(LM);
  layers.ring=L.circle([STN.lat,STN.lng],{radius:MAP.radius,renderer:canvas,interactive:false,weight:2.5,dashArray:"8 8",fill:true,fillOpacity:.04}).addTo(LM);
  layers.labels=L.layerGroup(MAP.labels.slice(0,24).map(l=>L.marker([l.lat,l.lng],{interactive:false,icon:L.divIcon({className:"",html:`<span class="rdlabel">${esc(l.t)}</span>`,iconSize:[0,0]})})));
  L.marker([STN.lat,STN.lng],{icon:L.divIcon({className:"",html:'<span class="pin-stn"></span>',iconSize:[0,0]}),title:"Balham station",keyboard:false}).bindTooltip("Balham station",{direction:"top",offset:[0,-10]}).addTo(LM);
  PUBS.forEach(p=>{
    const m = p.id===START.id
      ? L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:`<span class="pin-start">START · ${esc(p.name)}</span>`,iconSize:[0,0]}),title:p.name,zIndexOffset:900})
      : L.circleMarker([p.lat,p.lng],{renderer:canvas,radius:7,weight:2.5,fillOpacity:1});
    m.bindPopup(()=>pubPopup(p),{autoPanPadding:[30,80],maxWidth:300});
    if(HOVER) m.bindTooltip(()=>pubCard(p,false),{direction:"top",offset:[0,-10],opacity:1,className:"pubtip"});
    m.on("popupopen",()=>m.closeTooltip&&m.closeTooltip()); m.on("click",()=>{S.selPub=p.id;renderPubList();});
    m.addTo(LM); pubMarkers[p.id]=m;
  });
  layers.teams=L.layerGroup().addTo(LM);
  LM.on("zoomend",()=>{const z=LM.getZoom(); if(z>=15.5) layers.labels.addTo(LM); else layers.labels.remove();});
  styleMap(); fitAll(); renderMapDynamic();
}
function styleMap(){
  if(!LM) return;
  layers.green.eachLayer(l=>l.setStyle({fillColor:css("--m-green")}));
  layers.water.eachLayer(l=>l.setStyle({fillColor:css("--m-water")}));
  layers.case.eachLayer(l=>l.setStyle({color:css("--m-case")}));
  layers.minor.setStyle({color:css("--m-minor")}); layers.mid.setStyle({color:css("--m-mid")}); layers.major.setStyle({color:css("--m-major")});
  const ls_=layers.rail.getLayers(); ls_[0].setStyle({color:css("--m-rail")}); ls_[1].setStyle({color:css("--m-land")});
  layers.ring.setStyle({color:css("--comb"),fillColor:css("--comb")});
  stylePubs();
}
function stylePubs(){
  if(!LM) return;
  const tid=myTeamId(), seen=new Set(tid?visitsOf(tid).map(v=>v.pub):[]);
  PUBS.forEach(p=>{const m=pubMarkers[p.id]; if(!m||!m.setStyle) return;
    const done=seen.has(p.id), sel=S.selPub===p.id;
    m.setStyle({color:sel?css("--yolk"):css("--surface"),fillColor:done?css("--good"):css("--ink"),radius:sel?10:7});});
}
function fitAll(){if(LM) LM.fitBounds(L.latLng(STN.lat,STN.lng).toBounds(MAP.radius*2.1),{padding:[10,10]});}
function infoOf(p){const o=D.pubinfo[p.id]||{}; return {price:(o.price||"").trim(), hours:(o.hours||"").trim()||p.hours||"", note:(o.note||"").trim()};}
function pubCard(p, full){
  const i=infoOf(p), now=hoursNow(i.hours), from=lastPubOf(myTeamId())||null, dm=from&&from.id!==p.id?metres(from,p):null;
  const tags=[p.id===START.id?'<span class="pill yolk">Meeting point</span>':"", p.garden?'<span class="pill">Beer garden</span>':"", p.food?'<span class="pill">Food</span>':"", p.brand?`<span class="pill">${esc(p.brand)}</span>`:""].join("");
  return `<div class="pcard"><div class="pc-h"><b>${esc(p.name)}</b>${p.addr?`<span class="sm muted">${esc(p.addr)}</span>`:""}</div>
    <div class="pc-grid">
      <div><span class="lbl">Pint</span><b class="num">${i.price?esc(/^\d/.test(i.price)?"£"+i.price:i.price):"–"}</b><span class="sm muted">${i.price?"average":"not added yet"}</span></div>
      <div><span class="lbl">Today</span><b class="${now&&now.open?"ok":now&&now.open===false?"no":""}">${now?(now.open?"Open":now.open===false?"Closed":"–"):"–"}</b><span class="sm muted">${now?esc(now.txt):"Hours not listed"}</span></div>
      <div><span class="lbl">Walk</span><b class="num">${walkMin(dm||p.d)} min</b><span class="sm muted">from ${dm?"your last pub":"the station"}</span></div>
    </div>
    ${tags?`<div class="row" style="gap:6px">${tags}</div>`:""}
    ${i.note?`<p class="sm">${esc(i.note)}</p>`:""}
    ${full&&i.hours&&parseHours(i.hours)?`<details><summary class="sm">Opening hours this week</summary>${weekRows(i.hours)}</details>`:""}
    ${full&&p.web?`<a class="sm" href="${esc(p.web)}" target="_blank" rel="noopener">Pub website</a>`:""}
  </div>`;
}
function pubPopup(p){
  const tid=myTeamId(), seen=tid&&visitsOf(tid).some(v=>v.pub===p.id);
  const here=hunters().filter(t=>{const lp=lastPubOf(t.id);return lp&&lp.id===p.id&&!D.found[t.id];});
  return `<div class="pp">${pubCard(p,true)}
    ${here.length?`<span class="sm">Last seen here: ${here.map(t=>esc(t.name)).join(", ")}</span>`:""}
    <div class="row" style="gap:6px">${tid&&!seen&&!D.found[tid]?`<button class="btn sm primary" data-action="confirmcheckin" data-pub="${p.id}">Check in</button>`:seen?'<span class="pill good">Visited</span>':""}
    <a class="btn sm" href="${gmaps(p)}" target="_blank" rel="noopener">Directions</a></div></div>`;
}
function renderMapDynamic(){
  if(!LM) return;
  layers.teams.clearLayers();
  const at={};
  hunters().forEach(t=>{if(D.found[t.id])return;const lp=lastPubOf(t.id);if(lp)(at[lp.id]=at[lp.id]||[]).push(t);});
  Object.entries(at).forEach(([pid,ts])=>{const p=pubById(pid);ts.forEach((t,j)=>{
    const ang=-Math.PI/4+j*0.9;
    L.marker([p.lat+Math.sin(ang)*0.00018, p.lng+Math.cos(ang)*0.00028],{interactive:false,zIndexOffset:1000,icon:L.divIcon({className:"",html:`<span class="pin-team" style="background:${t.color}">${esc(t.name.replace(/^(The|Le|Les)\s+/i,"")[0])}</span>`,iconSize:[0,0]})}).addTo(layers.teams);});});
  stylePubs();
}
function renderPubList(){
  const el=document.getElementById("publist"); if(!el) return;
  const tid=myTeamId(), seen=new Set(tid?visitsOf(tid).map(v=>v.pub):[]), q=S.q.toLowerCase();
  const list=PUBS.filter(p=>!q||p.name.toLowerCase().includes(q));
  const legend=hunters().filter(t=>!D.found[t.id]).map(t=>{const lp=lastPubOf(t.id);return `<div class="row sm" style="gap:8px"><span class="dot" style="background:${t.color}"></span><b>${esc(t.name)}</b><span class="spacer"></span><span class="muted">${lp?esc(lp.name):"Not started"}</span></div>`;}).join("");
  el.innerHTML=`<div class="card" style="gap:8px"><span class="lbl">Teams last seen</span>${legend||'<span class="sm muted">Everyone has found the chicken.</span>'}<div class="row sm" style="gap:8px"><span class="dot" style="background:${chicken().color}"></span><b>${esc(chicken().name)}</b><span class="spacer"></span><span class="pill yolk">Hiding</span></div></div>
    <input type="search" id="mapq" placeholder="Search pubs" value="${esc(S.q)}" aria-label="Search pubs" autocomplete="off">
    <div class="items">${list.map(p=>`<button class="pubrow ${S.selPub===p.id?"sel":""}" data-action="focuspub" data-pub="${p.id}">
      <span class="ic ${p.id===START.id?"start":""} ${seen.has(p.id)?"done":""}">${seen.has(p.id)?"✓":p.id===START.id?"GO":fmtMi(p.d).replace(" mi","")}</span>
      <span style="min-width:0"><b>${esc(p.name)}</b><small>${(()=>{const i=infoOf(p),n=hoursNow(i.hours);return [p.id===START.id?"Meeting point":"", n?n.txt:"", i.price?(/^\d/.test(i.price)?"£"+i.price:i.price)+" pint":"", fmtMi(p.d)].filter(Boolean).join(" · ");})()}</small></span><span></span></button>`).join("")||'<p class="sm muted">No pubs match that.</p>'}</div>`;

/* =================== TEAMS =================== */
function viewTeams(){
  const fo=foundOrder();
  const ranked=hunters().slice().sort((a,b)=>{const fa=fo.indexOf(a.id),fb=fo.indexOf(b.id);
    if(fa>=0||fb>=0) return (fa<0?99:fa)-(fb<0?99:fb);
    return (D.unlocked[b.id]||[]).length-(D.unlocked[a.id]||[]).length || visitsOf(b.id).length-visitsOf(a.id).length;});
  const card=(t,i)=>{const lp=lastPubOf(t.id), f=fo.indexOf(t.id);
    return `<article class="teamcard"><div class="top"><span class="sw" style="background:${t.color}">${t.chicken?"P":i+1}</span><div style="min-width:0"><h3>${esc(t.name)}</h3><span class="sm muted">${t.chicken?"The chicken":lp?`Last seen at ${esc(lp.name)}`:"Not checked in yet"}</span></div><span class="spacer"></span>
      ${t.chicken?'<span class="pill yolk">Hiding</span>':f>=0?`<span class="pill good">Found ${["1st","2nd","3rd","4th","5th","6th"][f]||""}</span>`:'<span class="pill">Hunting</span>'}</div>
      <div class="body"><div class="members">${t.members.map(m=>`<span>${esc(m)}</span>`).join("")}</div>
      ${t.chicken?"":`<div class="kpis"><div><b class="num">${visitsOf(t.id).length}</b><span>Pubs</span></div><div><b class="num">${(D.unlocked[t.id]||[]).length}</b><span>Clues</span></div><div><b class="num">${pending().filter(s=>s.team===t.id).length}</b><span>Waiting</span></div></div>`}
      ${t.chicken||myTeamId()===t.id?"":`<button class="btn sm" data-action="setteam" data-id="${t.id}">This is my team</button>`}</div></article>`;};
  return `<div><h1>Teams</h1><p class="muted">Ranked by who found the chicken first, then by clues unlocked.</p></div>
    <div class="grid2">${card(chicken(),0)}${ranked.map(card).join("")}</div>`;
}

/* =================== RULES =================== */
function viewRules(){
  return `<div><h1>How to play</h1><p class="muted">Où est le Poulet is hide and seek with pubs. The chicken hides, everyone else drinks their way to finding them.</p></div>
  <div class="facts">
    <div class="fact yolk"><span class="lbl">Buy-in</span><b>${esc(CONFIG.buyIn)}</b><span class="sm">Per person, paid at the start. It goes in the kitty for the chicken's hideout.</span></div>
    <div class="fact"><span class="lbl">Meet</span><b>${esc(CONFIG.meetPub)}</b><span class="sm muted">${esc(CONFIG.meetAddr)}. ${esc(CONFIG.hosts)} buy the first round.${D.settings.start?` Start time: <b>${esc(D.settings.start)}</b>.`:""}</span></div>
    <div class="fact"><span class="lbl">Play area</span><b>${CONFIG.radiusMiles} mile${CONFIG.radiusMiles===1?"":"s"}</b><span class="sm muted">From Balham station. ${PUBS.length} pubs to choose from.</span></div>
    <div class="fact"><span class="lbl">Challenges</span><b>Every ${D.interval === 1 ? "pub" : D.interval === 2 ? "2nd pub" : D.interval+"th pub"}</b><span class="sm muted">Pass it, send proof, unlock a clue.</span></div>
  </div>
  <h2>The classic rules</h2>
  <ol class="steps">
    <li><div><h3>The chicken flies first</h3><p>After the first round at ${esc(CONFIG.meetPub)}, the chicken (${esc(chicken().members.join(" & "))}) leaves with a 15-minute head start and hides in any pub inside the ${CONFIG.radiusMiles}-mile ring. Once they're in, they stay in.</p></div></li>
    <li><div><h3>Hunt as a team</h3><p>Everyone else sets off in their teams. Stick together all night. No splitting up to cover more pubs.</p></div></li>
    <li><div><h3>A drink in every pub</h3><p>Every pub you walk into, each player buys and finishes a drink before you leave. A half or a soft drink counts. Check in on the app as you arrive.</p></div></li>
    <li><div><h3>Every ${D.interval===2?"second":"few"} pub is a challenge</h3><p>On a challenge pub the app shows your task. Do it, then send a photo or video as proof. When the chicken approves it, your next clue unlocks.</p></div></li>
    <li><div><h3>Found the chicken? Join the chicken</h3><p>Don't shout about it. Buy your drink, squeeze in quietly and let the chicken mark you found. You're hiding with them now, so no tipping off other teams.</p></div></li>
    <li><div><h3>Last team buys the round</h3><p>The game ends when the last team finds the pack, by now crammed into one pub. That team buys the chicken a drink and does a forfeit of Dom's choosing.</p></div></li>
  </ol>
  <div class="grid2">
    <div class="card"><h2>House rules</h2><ul class="plain">
      <li>Stay inside the dashed ${CONFIG.radiusMiles}-mile ring on the map.</li>
      <li>No calling, texting or location-tracking the chicken.</li>
      <li>No asking bar staff "have you seen a group of…". That's cheating, and they're busy.</li>
      <li>Drink water between rounds and look after each other. Nobody gets left behind.</li>
      <li>It's Dom's birthday. Dom's word is final on any dispute.</li>
    </ul></div>
    <div class="card"><h2>Using this app</h2><ul class="plain">
      <li>Pick your team on the Play tab. Your phone remembers it.</li>
      <li>Tap <b>Check in to a pub</b> each time you arrive somewhere new.</li>
      <li>On challenge pubs, send your proof right from the challenge card.</li>
      <li>Clues appear on the Play tab the moment the chicken approves.</li>
      <li>The Map tab shows every pub and where each team was last seen. The chicken never appears.</li>
    </ul></div>
  </div>`;
}

/* =================== ADMIN =================== */

function adminTeams(){

        <button class="btn sm ${f?"":"good"}" data-action="found" data-team="${t.id}">${f?"Undo found":"Mark found"}</button></div></div></div>`;}).join("")}</div>

/* =================== actions =================== */
async function compressImage(file){
  try{const bmp=await createImageBitmap(file); const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82));}catch(e){return file;}
}
async function submitEvidence(team,pub,i){
  const dk=team+"|"+pub, dr=S.draft[dk]||{files:[],note:""};
  if(!dr.files.length&&!dr.note.trim()){toast("Add a photo, video or a note first.");return;}
  const btn=document.querySelector(`[data-action="submit"][data-pub="${pub}"]`); if(btn){btn.disabled=true;btn.textContent="Sending…";}
  const media=[];
  try{
    if(dr.files.length){
      if(!assets) assets=window.claude&&window.claude.use?await window.claude.use("assets"):null;
      if(!assets){toast("Photo upload isn't available here. Send a note instead, or show the chicken.");if(btn){btn.disabled=false;btn.textContent="Send evidence to the chicken";}return;}
      for(const f of dr.files){
        const blob=f.type.startsWith("image")?await compressImage(f.file):f.file;
        if(blob.size>20*1024*1024){toast("That video is over 20 MB. Trim it and try again.");throw {code:"too_large"};}
        const r=await assets.upload(blob); media.push({id:r.id,url:r.url,type:r.contentType});
      }
    }
  }catch(e){ if(e&&e.code!=="too_large") toast(e&&e.code==="not_granted"?"Uploads aren't allowed for your account. Send a note instead.":"Upload failed. Check your signal and try again."); if(btn){btn.disabled=false;btn.textContent="Send evidence to the chicken";} return; }
  put(`subs/${team}__${pub}`,{team,pub,stop:i+1,media,note:dr.note.trim(),at:Date.now(),status:"pending",by:S.me.id||null});
  dr.files.forEach(f=>URL.revokeObjectURL(f.preview)); delete S.draft[dk];
  closeSheet(); toast("Sent. The chicken has been notified.");
}
function unlockFor(team, pubId, subId){
  const cur=(D.unlocked[team]||[]).slice(), n=cur.length, from=pubById(pubId)||lastPubOf(team);
  const text=(D.secret.clues[n]||"").trim()||autoClue(n,from);
  cur.push({n:n+1,text,at:Date.now(),pub:from?from.id:null});
  put(`unlocked/${team}`,{clues:cur});
  if(subId){const s=docs["subs/"+subId]; if(s) put("subs/"+subId,Object.assign({},s,{status:"approved",clue:n+1,reviewedAt:Date.now()}));}
  toast(`Clue ${n+1} unlocked for ${(teamById(team)||{}).name||team}.`);
}
function readClues(){return Array.from(document.querySelectorAll("[data-clue]")).map(t=>t.value);}
function saveSecret(patch){put("secret/game",Object.assign({hideout:D.secret.hideout,clues:D.secret.clues},patch,{at:Date.now()}));}

document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-action]"); if(!a) return;
  const act=a.dataset.action;
  if(act==="closesheet"){ if(e.target===a||a.tagName==="BUTTON") closeSheet(); return; }
  if(act==="pickfiles"||act==="note") return;
  e.preventDefault();
  switch(act){
    case "pickteam": openSheet(`<div class="row"><h2>Which team are you on?</h2><span class="spacer"></span><button class="btn sm ghost" data-action="closesheet">Close</button></div>${teamPicker()}`); break;
    case "setteam": ls.set("team",a.dataset.id); closeSheet(); renderAll(); toast(`You're on ${teamById(a.dataset.id).name}.`); if(route()!=="map") location.hash="play"; break;
    case "checkin": if(!myTeamId()){openSheet(`<h2>Pick your team first</h2>${teamPicker()}`);break;} openSheet(checkinSheet("")); break;
    case "confirmcheckin": {
      const tid=myTeamId(); if(!tid){openSheet(`<h2>Pick your team first</h2>${teamPicker()}`);break;}
      const p=pubById(a.dataset.pub), n=visitsOf(tid).length, stop=isStop(n);
      openSheet(`<h2>Check in to ${esc(p.name)}?</h2><p class="muted">This is pub ${n+1} for ${esc(teamById(tid).name)}.${stop?" <b>It's a challenge pub.</b> Your challenge appears straight after.":""}</p>
        <button class="btn primary block" data-action="docheckin" data-pub="${p.id}">Yes, we're here</button><button class="btn block ghost" data-action="closesheet">Cancel</button>`); break; }
    case "docheckin": {
      const tid=myTeamId(), p=pubById(a.dataset.pub);
      put(`visits/${tid}__${p.id}`,{team:tid,pub:p.id,at:Date.now(),by:S.me.id||null});
      closeSheet(); if(LM) LM.closePopup(); toast(`Checked in to ${p.name}. Get the drinks in.`); location.hash="play"; window.scrollTo(0,0); break; }
    case "undovisit": drop(`visits/${myTeamId()}__${a.dataset.pub}`); toast("Check-in removed."); break;
    case "openchal": openSheet(`<div class="row"><span class="spacer"></span><button class="btn sm ghost" data-action="closesheet">Close</button></div>${challengeCard(myTeamId(),a.dataset.pub,+a.dataset.i)}`); break;
    case "submit": submitEvidence(a.dataset.team,a.dataset.pub,+a.dataset.i); break;
    case "fit": fitAll(); break;
    case "gostart": if(LM){LM.flyTo([START.lat,START.lng],17);pubMarkers[START.id].openPopup();} break;
    case "focuspub": { const p=pubById(a.dataset.pub); S.selPub=p.id; renderPubList(); stylePubs(); if(LM){LM.flyTo([p.lat,p.lng],Math.max(LM.getZoom(),16.5));setTimeout(()=>pubMarkers[p.id].openPopup(),350);}
      if(matchMedia("(max-width:900px)").matches) document.querySelector(".mapbox").scrollIntoView({behavior:"smooth",block:"start"}); break; }
    case "atab": S.adminTab=a.dataset.k; renderView("admin"); break;
    case "approve": { const s=docs["subs/"+a.dataset.id]; if(s) unlockFor(s.team,s.pub,a.dataset.id); break; }
    case "reject": { const s=docs["subs/"+a.dataset.id], r=document.getElementById("rej-"+a.dataset.id); if(s) put("subs/"+a.dataset.id,Object.assign({},s,{status:"rejected",reviewNote:r?r.value.trim():"",reviewedAt:Date.now()})); toast("Sent back to the team."); break; }
    case "unlock": unlockFor(a.dataset.team,null,null); break;
    case "relock": { const cur=(D.unlocked[a.dataset.team]||[]).slice(0,-1); put(`unlocked/${a.dataset.team}`,{clues:cur}); toast("Clue re-locked."); break; }
    case "found": { const t=a.dataset.team; if(D.found[t]) drop("found/"+t); else {put("found/"+t,{found:true,at:Date.now()}); toast(`${teamById(t).name} found the chicken!`);} break; }
    case "addclue": saveSecret({clues:readClues().concat([""])}); break;
    case "delclue": { const c=readClues(); c.splice(+a.dataset.i,1); saveSecret({clues:c}); break; }
    case "saveclues": saveSecret({clues:readClues()}); toast("Clues saved."); break;
    case "savechal": { const id=a.dataset.pub, t=document.getElementById(`ch-${id}-t`).value.trim(), x=document.getElementById(`ch-${id}-x`).value.trim();
      const by=Object.assign({},D.challenges); if(t||x) by[id]={title:t,text:x}; else delete by[id];
      put("content/challenges",{byPub:by});
      const pp=document.getElementById(`pi-${id}-p`);
      if(pp){const inf={price:pp.value.trim(),hours:document.getElementById(`pi-${id}-h`).value.trim(),note:document.getElementById(`pi-${id}-n`).value.trim()};
        const bi=Object.assign({},D.pubinfo); if(inf.price||inf.hours||inf.note) bi[id]=inf; else delete bi[id]; put("content/pubinfo",{byPub:bi});}
      toast("Saved."); break; }
    case "savesettings": put("content/settings",Object.assign({},D.settings,{start:document.getElementById("set-start").value.trim(),interval:Math.max(1,Math.min(6,parseInt(document.getElementById("set-int").value)||2))})); toast("Settings saved."); break;
    case "addteam": { const teams=readTeams(); const used=new Set(teams.map(t=>t.color)); teams.push({id:"t"+Date.now().toString(36),name:"New team",color:PALETTE.find(c=>!used.has(c))||PALETTE[0],members:[]}); put("content/teams",{list:teams}); break; }
    case "delteam": { const teams=readTeams(); teams.splice(+a.dataset.i,1); put("content/teams",{list:teams}); break; }
    case "saveteams": put("content/teams",{list:readTeams()}); toast("Teams saved."); break;
    case "addadmin": { const ids=Array.from(new Set(D.admins.concat([a.dataset.id]))); put("content/admins",{ids}); toast("Organiser added."); break; }
    case "deladmin": put("content/admins",{ids:D.admins.filter(x=>x!==a.dataset.id)}); break;
  }
}, true);
function readTeams(){return D.teams.map((t,i)=>({...t,name:(document.getElementById("tn-"+i)||{}).value||t.name,color:(document.getElementById("tc-"+i)||{}).value||t.color,
  members:((document.getElementById("tm-"+i)||{}).value||"").split(/[,\n]/).map(s=>s.trim()).filter(Boolean),chicken:i===0}));}

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="pubq"){const q=el.value;const box=document.createElement("div");box.innerHTML=checkinSheet(q);document.getElementById("pubqlist").replaceWith(box.querySelector("#pubqlist"));}
  else if(el.id==="mapq"){S.q=el.value;const pos=el.selectionStart;renderPubList();const n=document.getElementById("mapq");n.focus();n.setSelectionRange(pos,pos);}
  else if(el.id==="chalq"){S.cq=el.value;const pos=el.selectionStart;renderView("admin");const n=document.getElementById("chalq");n.focus();n.setSelectionRange(pos,pos);}
  else if(el.dataset.action==="note"){(S.draft[el.dataset.key]=S.draft[el.dataset.key]||{files:[],note:""}).note=el.value;}
  else if(el.id==="adminq") searchAdmins(el.value);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.action==="pickfiles"){const dk=el.dataset.key, d=(S.draft[dk]=S.draft[dk]||{files:[],note:""});
    Array.from(el.files).slice(0,4).forEach(f=>d.files.push({file:f,type:f.type||"image/jpeg",preview:URL.createObjectURL(f)}));
    const [tid,pub]=dk.split("|"); const inSheet=el.closest(".sheet"); const i=visitsOf(tid).findIndex(v=>v.pub===pub);
    if(inSheet) openSheet(`<div class="row"><span class="spacer"></span><button class="btn sm ghost" data-action="closesheet">Close</button></div>${challengeCard(tid,pub,i)}`); else renderView("play");}
  else if(el.id==="hideout"){saveSecret({hideout:el.value||null,clues:document.querySelector("[data-clue]")?readClues():D.secret.clues});toast(el.value?"Hideout set.":"Hideout cleared.");}
});
document.addEventListener("mouseover",e=>{const r=e.target.closest&&e.target.closest(".pubrow[data-action=focuspub]"); if(!r||!LM||!HOVER) return;
  const m=pubMarkers[r.dataset.pub]; if(m&&m.openTooltip&&m.getTooltip()) m.openTooltip();});
document.addEventListener("mouseout",e=>{const r=e.target.closest&&e.target.closest(".pubrow[data-action=focuspub]"); if(!r||!LM) return;
  if(r.contains(e.relatedTarget)) return; const m=pubMarkers[r.dataset.pub]; if(m&&m.closeTooltip) m.closeTooltip();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector(".scrim"))closeSheet();});
let adminSearchT;
function searchAdmins(q){clearTimeout(adminSearchT);adminSearchT=setTimeout(async()=>{const box=document.getElementById("adminres");if(!box||!userApi||!userApi.search)return;
  try{const res=await userApi.search(q);box.innerHTML=res.filter(p=>!p.isMe).slice(0,6).map(p=>`<div class="trow"><span class="dot" style="background:${esc(p.color||"#888")}"></span><span></span><button class="btn sm" data-action="addadmin" data-id="${esc(p.id)}">Add</button></div>`).join("")||'<p class="sm muted">Nobody found. Share the page with them first.</p>';
    box.querySelectorAll(".trow").forEach((r,i)=>{r.children[1].textContent=res.filter(p=>!p.isMe)[i].name||"Someone";});}catch(err){box.innerHTML='<p class="sm muted">Search isn\'t available right now.</p>';}},250);}
async function fillAdminNames(){const box=document.getElementById("adminlist");if(!box||!D.admins.length)return;
  let names={};try{if(userApi&&userApi.profiles)names=await userApi.profiles(D.admins);}catch(e){}
  box.innerHTML=D.admins.map(id=>`<div class="trow"><span class="dot" style="background:var(--yolk)"></span><span data-n="${esc(id)}"></span>${S.me.isOwner?`<button class="btn sm ghost danger" data-action="deladmin" data-id="${esc(id)}">Remove</button>`:"<span></span>"}</div>`).join("");
  box.querySelectorAll("[data-n]").forEach(s=>{const p=names[s.dataset.n];s.textContent=(p&&p.name)||"Someone";});}

/* =================== render =================== */
const VIEWS={play:viewPlay,teams:viewTeams,rules:viewRules,admin:viewAdmin};
function renderView(k){ if(VIEWS[k]){const el=document.getElementById("v-"+k); el.innerHTML=VIEWS[k](); if(k==="admin"&&S.adminTab==="setup") fillAdminNames();} }
function renderAll(){
  renderChrome(); const r=route();
  if(r==="map"){ initMap(); if(LM) setTimeout(()=>LM.invalidateSize(),0); renderPubList(); renderMapDynamic(); }
  else { const a=document.activeElement, typing=a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="file"&&a.type!=="checkbox"))&&document.getElementById("v-"+r).contains(a);
    if(!typing) renderView(r); }
  if(LM) renderMapDynamic();
}
window.addEventListener("hashchange",()=>{renderAll();window.scrollTo(0,0);});
const mq=matchMedia("(prefers-color-scheme: dark)"); (mq.addEventListener?mq.addEventListener("change",styleMap):mq.addListener(styleMap));
new MutationObserver(styleMap).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* =================== boot =================== */
Object.assign(docs, ls.get("docs")||{}); derive(); renderAll();
(async()=>{
  let ok=false;
  try{ db = window.claude&&window.claude.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(!db){ S.mode="local"; S.loaded=true; renderAll(); return; }
  for(const k of Object.keys(docs)) delete docs[k];
  S.mode="db"; derive(); renderAll();
  try{ userApi=await window.claude.use("user");
    if(userApi){ S.me.isOwner=!!(await userApi.isOwner()); S.me.id=await userApi.id(); const c=await userApi.can("data.write"); if(c===false) S.canWrite=false; }
  }catch(e){}
  window.claude.use("assets").then(a=>{assets=a;}).catch(()=>{});
  const cols=["content","visits","subs","unlocked","found","secret"]; let waiting=cols.length;
  const timer=setTimeout(()=>{if(!S.loaded) toast("Still connecting. Check your signal.");},10000);
  cols.forEach(c=>{let first=true;
    db.collection(c).onSnapshot(snap=>{
      for(const k of Object.keys(docs)) if(k.startsWith(c+"/")) delete docs[k];
      snap.docs.forEach(d=>{docs[c+"/"+d.id]=d.data();});
      if(first&&!snap.metadata.fromCache){first=false; if(--waiting===0){S.loaded=true;clearTimeout(timer);}}
      derive(); renderAll();
    }, err=>{ if(first){first=false; if(--waiting===0){S.loaded=true;clearTimeout(timer);}} renderAll(); });
  });
})();
</script>
